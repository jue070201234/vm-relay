name: relay-claude-vm-bundle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Download bundle files from Anthropic
        run: |
          set -euo pipefail
          SHA=882518393ed4ce89020bd48d99d5daf114999773
          BASE="https://downloads.claude.ai/vms/linux/x64/${SHA}"
          mkdir -p out
          for f in rootfs.vhdx.zst vmlinuz.zst initrd.zst; do
            echo "--- downloading ${f}"
            curl -fSL --retry 5 --retry-delay 5 --retry-all-errors \
                 --connect-timeout 30 -A "Mozilla/5.0" \
                 -o "out/${f}" "${BASE}/${f}"
            ls -l "out/${f}"
          done

      - name: Verify official checksums
        run: |
          set -euo pipefail
          cd out
          sha256sum rootfs.vhdx.zst vmlinuz.zst initrd.zst
          echo "5696e58a854c2fb3e14c4d78038c398671cc89cf1fcf60316c5c421825bbf5c6  rootfs.vhdx.zst" > expected.txt
          echo "8c74da17c86a7efad89b43fd0d11235dc257b13a7f56b2fdd3677d3fe3562a3e  vmlinuz.zst" >> expected.txt
          echo "6bf448d34e72d8c0bbda9c32eb3589e2b602b6c780df6880212e2cf7a778fa34  initrd.zst" >> expected.txt
          sha256sum -c expected.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create vm-88251839 \
            out/rootfs.vhdx.zst out/vmlinuz.zst out/initrd.zst \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Claude Cowork VM bundle 88251839 (win32-x64)" \
            --notes "Official bundle relayed for offline install. rootfs.vhdx.zst 1289469649 / vmlinuz.zst 14761727 / initrd.zst 27816400. sha256 verified against app.asar manifest."
          gh release view vm-88251839 --repo "${GITHUB_REPOSITORY}"
