name: relay-claude-vm-bundle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Download bundle files from Anthropic
        run: |
          set -uo pipefail
          SHA=882518393ed4ce89020bd48d99d5daf114999773
          BASE="https://downloads.claude.ai/vms/linux/x64/${SHA}"
          mkdir -p out
          for f in rootfs.vhdx.zst vmlinuz.zst initrd.zst; do
            echo "--- downloading ${f}"
            if curl -fSL --retry 5 --retry-delay 5 --retry-all-errors \
                 --connect-timeout 30 -A "Mozilla/5.0" \
                 -o "out/${f}" "${BASE}/${f}"; then
              echo "OK ${f}"
            else
              echo "FAIL ${f} rc=$?"
              rm -f "out/${f}"
            fi
          done
          ls -l out/ || true

      - name: Report actual checksums
        run: |
          set -uo pipefail
          cd out
          echo "### Actual files" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| file | bytes | sha256 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for f in rootfs.vhdx.zst vmlinuz.zst initrd.zst; do
            if [ -f "$f" ]; then
              H=$(sha256sum "$f" | cut -d' ' -f1)
              S=$(stat -c%s "$f")
              printf '%s  %s  (%s bytes)\n' "$H" "$f" "$S"
              echo "| $f | $S | \`$H\` |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "MISSING $f"
              echo "| $f | MISSING | - |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          if [ ! -s out/rootfs.vhdx.zst ]; then
            echo "rootfs missing, abort publish"
            exit 1
          fi
          gh release delete vm-88251839 --yes --repo "${GITHUB_REPOSITORY}" 2>/dev/null || true
          FILES="out/rootfs.vhdx.zst"
          [ -s out/vmlinuz.zst ] && FILES="$FILES out/vmlinuz.zst"
          [ -s out/initrd.zst ] && FILES="$FILES out/initrd.zst"
          gh release create vm-88251839 $FILES \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Claude Cowork VM bundle 88251839 (win32-x64)" \
            --notes "Relayed for offline install. sha256 listed in the job summary of the run."
          gh release view vm-88251839 --repo "${GITHUB_REPOSITORY}"
